<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Dorado</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1410;
      --card: #1a221c;
      --gold: #d4a017;
      --text: #f4f1e8;
      --muted: #b7b1a3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(36rem, calc(100% - 2rem));
      padding: 2.5rem 2rem;
      background: var(--card);
      border: 1px solid rgba(212, 160, 23, 0.35);
      border-radius: 1rem;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 2.4rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--gold);
    }
  </style>
</head>
<body>
  <main>
    <h1>Club Dorado</h1>
    <p>Estamos definiendo las bases del proyecto. Esta página es solo el punto de partida.</p>
  </main>
</body>
</html>
